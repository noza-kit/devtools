[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notify"
version = "0.1.0"
description = "Multi-channel notifications (Slack, Discord, LINE Messaging API, desktop) built on reqretry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reqretry",
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
