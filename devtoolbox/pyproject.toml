[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolbox"
version = "0.1.0"
description = "Personal CLI toolbox: project init & snippet manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pyperclip>=1.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
projinit = "devtoolbox.projinit.cli:app"
snip = "devtoolbox.snip.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devtoolbox.projinit" = ["templates/**/*"]
