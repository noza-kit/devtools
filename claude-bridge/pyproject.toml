[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bridge"
version = "0.1.0"
description = "Discord-controlled remote operation of Claude Code: a always-on bot that runs instructions posted to a Discord channel via `claude -p` and reports back"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reqretry",
    "confload",
    "notify",
    "typer>=0.12",
    "discord.py>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "responses>=0.24"]

[project.scripts]
claude-bridge = "claude_bridge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
