[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projarchive"
version = "0.1.0"
description = "Archive/restore project venvs to save disk space while keeping them reproducible"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
projarchive = "projarchive.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
