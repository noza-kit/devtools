[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airshare"
version = "0.1.0"
description = "AirDrop-like local web server for sending files between iPhone and PC over the same Wi-Fi network, with an optional Inbox-watching auto-organize/notify daemon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "qrcode>=7.4",
    "pillow>=10.0",
    "typer>=0.12",
    "requests>=2.31",
    "confload",
    "watchdog>=4.0",
    "winotify>=1.1; sys_platform == 'win32'",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
airshare = "airshare.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"airshare" = ["templates/*.html", "static/*"]
