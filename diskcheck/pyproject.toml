[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcheck"
version = "0.1.0"
description = "Storage management CLI: directory size ranking, duplicate file detection, and stale installer cleanup candidates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "confload",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
diskcheck = "diskcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
