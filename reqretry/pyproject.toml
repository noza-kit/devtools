[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqretry"
version = "0.1.0"
description = "Thin wrapper around requests with configurable exponential-backoff retries and default timeouts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
