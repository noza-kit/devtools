[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysreport"
version = "0.1.0"
description = "PC startup health check: storage/battery/CPU/memory snapshot sent via notify, with Windows Task Scheduler autostart"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "confload",
    "diskcheck",
    "notify",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sysreport = "sysreport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
