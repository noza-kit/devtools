[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batchimg"
version = "0.1.0"
description = "Batch resize/rename/trim images and videos (OpenCV-based) with a preview-before-run workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
batchimg = "batchimg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
