[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedwatch"
version = "0.1.0"
description = "RSS feed monitor (YouTube channels, etc.) with a separate Twitch live-detection path, notifying via notify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reqretry",
    "confload",
    "notify",
    "typer>=0.12",
    "rich",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.24"]

[project.scripts]
feedwatch = "feedwatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
