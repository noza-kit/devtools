[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-comments"
version = "0.1.0"
description = "CLI that translates source code comments (ja/en/fr) via DeepL, leaving code untouched"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reqretry",
    "confload",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.24"]

[project.scripts]
translate-comments = "translate_comments.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
