[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikigen"
version = "0.1.0"
description = "Static searchable wiki site generator built from a folder of Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "markdown>=3.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wikigen = "wikigen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wikigen" = ["templates/*.html", "static/*"]
