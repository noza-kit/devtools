[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbridge"
version = "0.1.0"
description = "Unity <-> OpenCV video bridge over ZeroMQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uzbridge = "uzbridge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
