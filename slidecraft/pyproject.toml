[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidecraft"
version = "0.1.0"
description = "Convert LLM-generated structured HTML into an editable PPTX, optionally against an existing template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "python-pptx>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slidecraft = "slidecraft.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
