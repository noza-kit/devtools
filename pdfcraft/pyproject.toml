[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcraft"
version = "0.1.0"
description = "Local-only PDF toolkit: split/merge/compress/rotate/N-up, image<->PDF report generation, encryption/redaction, and layout-aware Markdown/OCR extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
dev = ["pytest>=8.0"]

[project.scripts]
pdfcraft = "pdfcraft.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
