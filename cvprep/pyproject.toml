[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvprep"
version = "0.1.0"
description = "OpenCV preprocessing one-liners with YAML-configured presets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cvprep = "cvprep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
