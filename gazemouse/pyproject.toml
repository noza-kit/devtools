[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazemouse"
version = "0.1.0"
description = "Hands-free gaze + gesture desktop control: eye tracking moves the cursor, hand/blink/head gestures drive clicks, screenshots, and scrolling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "pyautogui>=0.9",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gazemouse = "gazemouse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
